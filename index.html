<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Part Status Board</title>
<style>
:root{--bg:#f1f2ef;--surface:#fcfcfa;--ink:#1e2a2e;--muted:#5d6c70;--line:#cdd5d3;--steel:#2f6f7a;--steel-soft:#dcebec;--good:#2f7a4f;--good-soft:#dcefe3;--bad:#b3392f;--bad-soft:#f6dcd9;--amber:#b86a12;--amber-soft:#f6e6cf}
@media (prefers-color-scheme:dark){:root{--bg:#12191b;--surface:#1a2427;--ink:#e4ecea;--muted:#9aaeb2;--line:#324246;--steel:#6fb4bf;--steel-soft:#1f3a40;--good:#6cc08e;--good-soft:#1c3427;--bad:#e58a82;--bad-soft:#3b2220;--amber:#e0a35a;--amber-soft:#3a2d1a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:18px 14px 48px}
.wrap{max-width:1500px;margin:0 auto}
h1{margin:0 0 2px;font-size:1.6rem}
.sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.bar-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
button,select{font:inherit}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;padding:7px 11px;font-size:13px;cursor:pointer}
.btn.primary{background:var(--steel);border-color:var(--steel);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.msg{font-size:13px;padding:8px 12px;border-radius:4px;margin-bottom:12px}
.msg.ok{background:var(--good-soft);color:var(--good)}
.msg.err{background:var(--bad-soft);color:var(--bad)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 11px}
.tile b{display:block;font-size:1.4rem;line-height:1.1}
.tile span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile.bad b{color:var(--bad)}.tile.warn b{color:var(--amber)}
.buckets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.bk{text-align:left;background:var(--steel-soft);border:2px solid transparent;border-radius:8px;padding:9px 11px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:3px;min-width:0}
.bk.rework{background:var(--amber-soft)}.bk.scrap{background:var(--bad-soft)}
.bk.sel{border-color:var(--steel);box-shadow:0 0 0 2px var(--steel-soft)}
.bk.rework.sel{border-color:var(--amber)}.bk.scrap.sel{border-color:var(--bad)}
.bk .nm2{font-size:12.5px;font-weight:600;line-height:1.25}
.bk .cnt{font-size:1.7rem;font-weight:700;line-height:1}
.bk .ids{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.bk.zero{opacity:.6}
.open-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:2px 0 8px}
.open-h h2{margin:0;font-size:1.05rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;align-items:start;margin-bottom:12px}
.card.rw{border-left:5px solid var(--amber)}
.rwbox{background:var(--amber-soft);color:var(--ink);border-radius:4px;padding:6px 8px;font-size:12.5px;display:flex;flex-direction:column;gap:2px}
.rwbox b{color:var(--amber)}
.bdg{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:9px;margin-right:4px}
.bdg.rw{background:var(--amber);color:#fff}.bdg.nt{background:var(--steel);color:#fff}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;grid-column:1/-1;margin-top:2px}
.grp.rw{color:var(--amber)}
details.notes,details.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-bottom:10px;font-size:13px}
details.notes summary,details.chartbox summary{cursor:pointer;font-weight:600}
.nform{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.nform input,.nform select{padding:5px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);min-width:0;font-size:13px}
.nform input[type=text]{grid-column:1/-1}.nform .btn{grid-column:1/-1}
.nlist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.nlist li{border-left:3px solid var(--steel);background:var(--steel-soft);padding:6px 9px;border-radius:3px;display:flex;flex-direction:column;gap:2px}
.nlist li.read{opacity:.6;border-left-color:var(--line);background:transparent}
.nlist .meta{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.nlist button{border:0;background:none;color:var(--steel);cursor:pointer;font-size:12px;padding:0;text-decoration:underline}
.msg .go{margin-left:10px}
.bdg.hd{background:var(--bad);color:#fff}.bdg.wp{background:var(--steel);color:#fff}
.opsel,.opnote{padding:3px 4px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);font-size:12.5px;min-width:0}
.opnote{width:100%;min-width:130px}
tr.hold td{background:var(--bad-soft)}tr.wip td{background:var(--amber-soft)}
.st.h{color:var(--bad)}.st.w{color:var(--amber)}
.holdflag{font-size:12.5px;background:var(--bad-soft);color:var(--bad);border-radius:4px;padding:4px 8px;font-weight:600}
.chart{width:100%;max-width:600px;height:auto;display:block}
.chart text{fill:var(--ink);font-size:12px;font-family:inherit}
.chart .cn{font-weight:700}
.chart .b0{fill:var(--steel)}.chart .b1{fill:var(--amber)}.chart .b2{fill:var(--bad)}
.chart line{stroke:var(--line)}
.empty{color:var(--muted);font-size:12.5px;padding:6px 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:11px;display:flex;flex-direction:column;gap:7px;min-width:0}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pid{font-weight:700;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.nm,.small{color:var(--muted);font-size:12.5px}
.bars{display:flex;gap:2px}.bars i{flex:1;height:6px;border-radius:2px;background:var(--line)}.bars i.on{background:var(--steel)}.bars.red i.on{background:var(--bad)}
.k{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.mach{font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.mach select{font-size:12.5px;padding:2px 4px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink)}
.chg{background:var(--amber-soft);color:var(--amber);font-size:11.5px;padding:1px 6px;border-radius:3px;font-weight:600}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:4px}
.ok{background:var(--good-soft);color:var(--good)}.fail{background:var(--bad-soft);color:var(--bad)}.wait{background:var(--amber-soft);color:var(--amber)}
.issue{font-size:12.5px;background:var(--bad-soft);border-left:3px solid var(--bad);padding:6px 8px;border-radius:3px;display:flex;flex-direction:column;gap:3px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row .btn{flex:1 1 auto;padding:6px 8px}
.moveto{width:100%;padding:5px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);font-size:12.5px}
.form{border:1px dashed var(--line);border-radius:5px;padding:8px;display:flex;flex-direction:column;gap:5px;font-size:13px}
.form label{display:flex;gap:6px;align-items:center}
.form input[type=text]{padding:5px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);width:100%}
.log{margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:13px}
.log h3{margin:0 0 6px;font-size:.95rem}
.log ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.sheet{background:var(--surface);border-radius:8px;max-width:760px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.sheet header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sheet .body{overflow:auto;padding:0 4px 8px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line)}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);position:sticky;top:0;background:var(--surface)}
tr.done td{color:var(--muted)}tr.now td{background:var(--steel-soft)}tr.bad td{background:var(--bad-soft)}
.st{font-weight:700}.st.d{color:var(--good)}.st.n{color:var(--steel)}.st.b{color:var(--bad)}
</style>
</head>
